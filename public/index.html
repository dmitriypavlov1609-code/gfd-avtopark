<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ГФД · CRM · aboba dev × MiP</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0B1F33; --bg-2:#0E2841; --bg-3:#103252; --bg-4:#0A1B2C;
    --ink:#061525;
    --cream:#F5EFE6; --cream-2:#D4CCC0; --cream-3:#8B8377; --cream-4:#5E574E;
    --coral:#FF6B47; --coral-deep:#D74A28; --coral-soft:rgba(255,107,71,.14);
    --sea:#4A8FA8; --gold:#C5A572;
    --line:rgba(245,239,230,.08);
    --line-2:rgba(245,239,230,.14);
    --line-3:rgba(245,239,230,.24);
    --green:#5DCB94; --warn:#FFB84A; --red:#FF6464;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%}
  body{background:var(--bg);color:var(--cream);font-family:'Manrope',sans-serif;font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}

  /* layout shell */
  .app{display:grid;grid-template-columns:240px 1fr;height:100vh}
  /* sidebar */
  .side{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .side-brand{padding:22px 22px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .side-brand .logo{width:34px;height:34px;border-radius:8px;background:var(--coral);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.03em}
  .side-brand .name{font-family:'Manrope',sans-serif;font-weight:600;font-size:18px;color:var(--cream);letter-spacing:-.01em;line-height:1.1}
  .side-brand .name small{display:block;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--cream-3);letter-spacing:.12em;text-transform:uppercase;font-weight:400;margin-top:3px}
  .side-section{padding:14px 14px 6px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--cream-4);letter-spacing:.16em;text-transform:uppercase}
  .side-nav{padding:6px 8px;display:flex;flex-direction:column;gap:1px}
  .side-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;color:var(--cream-2);font-size:13.5px;cursor:pointer;transition:background .15s,color .15s;font-weight:500}
  .side-item:hover{background:rgba(245,239,230,.04);color:var(--cream)}
  .side-item.active{background:var(--coral-soft);color:var(--coral)}
  .side-item .ic{width:16px;height:16px;flex-shrink:0;opacity:.85}
  .side-item .count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--cream-3);font-weight:400;letter-spacing:.04em}
  .side-item.active .count{color:var(--coral)}
  .side-item .count.live{color:var(--green);font-weight:600}
  .side-item.highlight{background:linear-gradient(90deg,rgba(255,107,71,.06),transparent)}
  .side-foot{margin-top:auto;padding:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .side-foot .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#FFB196,#FF6B47);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .side-foot .user{font-size:12.5px;color:var(--cream);font-weight:500;line-height:1.2}
  .side-foot .user small{display:block;font-size:10px;color:var(--cream-3);font-weight:400;letter-spacing:.04em;margin-top:2px}

  /* main */
  .main{display:flex;flex-direction:column;overflow:hidden}
  .topbar{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:14px;background:var(--bg);flex-shrink:0}
  .topbar .crumb{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cream-3);letter-spacing:.04em}
  .topbar .crumb b{color:var(--cream);font-weight:500}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(245,239,230,.04);border:1px solid var(--line-2);padding:7px 12px;border-radius:7px;min-width:280px;transition:border-color .2s}
  .search:focus-within{border-color:var(--coral)}
  .search input{background:transparent;border:0;outline:0;color:var(--cream);font-family:inherit;font-size:13px;flex:1}
  .search input::placeholder{color:var(--cream-4)}
  .search .key{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--cream-4);padding:2px 6px;background:rgba(245,239,230,.04);border-radius:4px;letter-spacing:.04em}
  .mode-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;border-radius:99px;border:1px solid currentColor}
  .mode-pill.live{color:var(--green)}
  .mode-pill.demo{color:var(--warn)}
  .mode-pill .pulse{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35;transform:scale(.6)}}
  /* GLOBAL BUTTON RESET — все кнопки наследуют бренд */
  button{background:transparent;color:var(--cream-2);border:1px solid var(--line-2);padding:6px 12px;border-radius:7px;font-family:inherit;font-size:12.5px;cursor:pointer;transition:all .15s;font-weight:500;letter-spacing:.01em;line-height:1.5}
  button:hover{background:rgba(245,239,230,.05);border-color:var(--line-3);color:var(--cream)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none}
  button.primary{background:var(--coral);color:var(--ink);border-color:var(--coral);font-weight:600}
  button.primary:hover{background:var(--coral-deep);border-color:var(--coral-deep);color:var(--ink)}
  button.ghost{background:transparent}
  button.danger{color:var(--red);border-color:rgba(255,100,100,.3)}
  button.danger:hover{background:rgba(255,100,100,.08);border-color:var(--red);color:var(--red)}
  /* small inline buttons */
  button.sm{padding:4px 10px;font-size:11px;border-radius:6px}
  /* icon-only buttons */
  button.icon{padding:6px 8px;display:inline-flex;align-items:center;justify-content:center}

  /* content */
  .content{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
  .content::-webkit-scrollbar{width:6px;height:6px}
  .content::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
  .page-head h1{font-family:'Manrope',sans-serif;font-weight:600;font-size:24px;letter-spacing:-.01em;color:var(--cream);line-height:1.1}
  .page-head .sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cream-3);letter-spacing:.08em;margin-top:4px}
  .page-head .actions{display:flex;gap:8px}

  /* card / surface */
  .card{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .card .h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .card .h .t{font-size:13px;font-weight:600;color:var(--cream);letter-spacing:.01em}
  .card .h .m{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--cream-3);letter-spacing:.08em}
  .card .b{padding:16px 18px}
  .card .b.flush{padding:0}

  /* stat grid */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .stat{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden}
  .stat .l{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--cream-3);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
  .stat .v{font-family:'Manrope',sans-serif;font-weight:700;font-size:28px;color:var(--cream);letter-spacing:-.025em;line-height:1}
  .stat .d{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--cream-2)}
  .stat .d .delta{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.04em;padding:2px 7px;border-radius:99px}
  .stat .d .delta.up{color:var(--green);background:rgba(93,203,148,.1)}
  .stat .d .delta.down{color:var(--red);background:rgba(255,100,100,.1)}
  .stat .d .lab{color:var(--cream-4);font-size:11px}

  /* table */
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:left;padding:10px 16px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--cream-3);letter-spacing:.12em;text-transform:uppercase;font-weight:500;border-bottom:1px solid var(--line);background:var(--bg-4)}
  .tbl td{padding:12px 16px;border-bottom:1px solid var(--line);color:var(--cream-2);vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tr:hover td{background:rgba(245,239,230,.02)}
  .tbl td .id{font-family:'JetBrains Mono',monospace;color:var(--cream-3);font-size:11px;letter-spacing:.04em}
  .tbl td .pri{color:var(--cream);font-weight:500}
  .tbl td .sec{color:var(--cream-3);font-size:11.5px;display:block;margin-top:2px}

  /* status */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;font-weight:600;line-height:1.5}
  .pill::before{content:"●";font-size:6px}
  .pill.active{background:rgba(93,203,148,.12);color:var(--green)}
  .pill.pending{background:rgba(255,184,74,.12);color:var(--warn)}
  .pill.done{background:rgba(74,143,168,.16);color:var(--sea)}
  .pill.cancelled{background:rgba(255,100,100,.12);color:var(--red)}
  .pill.maint{background:rgba(255,184,74,.12);color:var(--warn)}
  .pill.avail{background:rgba(93,203,148,.12);color:var(--green)}
  .pill.rented{background:rgba(255,107,71,.14);color:var(--coral)}

  .chan{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;font-weight:600;background:var(--bg-3);color:var(--cream-2)}

  /* fleet bar utilization */
  .util-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--bg-3);margin-bottom:14px}
  .util-bar .seg{height:100%}
  .util-bar .seg.rented{background:var(--coral)}
  .util-bar .seg.avail{background:var(--green)}
  .util-bar .seg.maint{background:var(--warn)}
  .util-legend{display:flex;gap:14px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--cream-3);letter-spacing:.04em}
  .util-legend span::before{content:"●";color:var(--coral);margin-right:5px}
  .util-legend span.l2::before{color:var(--green)}
  .util-legend span.l3::before{color:var(--warn)}

  /* mini grid (dashboard 2 columns) */
  .grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

  /* convo list */
  .convo-host{display:grid;grid-template-columns:320px 1fr;gap:14px;height:calc(100vh - 160px)}
  .convo-list{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .convo-list-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .convo-list-h h3{font-size:13px;font-weight:600;color:var(--cream)}
  .convo-list-h .filter{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--cream-3);letter-spacing:.04em}
  .convo-list-body{flex:1;overflow-y:auto}
  .convo{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s;position:relative}
  .convo:hover{background:rgba(245,239,230,.03)}
  .convo.active{background:rgba(255,107,71,.06);border-left:2px solid var(--coral);padding-left:14px}
  .convo .top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .convo .name{font-size:13px;color:var(--cream);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .convo .time{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--cream-3);letter-spacing:.04em;flex-shrink:0}
  .convo .preview{font-size:12px;color:var(--cream-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
  .convo .meta{display:flex;align-items:center;gap:6px;margin-top:6px}
  .convo .unread{position:absolute;top:14px;right:10px;background:var(--coral);color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:9px;padding:1px 6px;border-radius:99px;font-weight:700;min-width:18px;text-align:center}

  .convo-detail{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
  .convo-detail-h{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .convo-detail-h .avatar{width:36px;height:36px;border-radius:50%;background:var(--bg-3);color:var(--coral);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:1px solid var(--line-2)}
  .convo-detail-h .name{font-size:14px;color:var(--cream);font-weight:600;line-height:1.2}
  .convo-detail-h .meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--cream-3);letter-spacing:.04em;margin-top:2px}
  .convo-detail-h .actions{margin-left:auto;display:flex;gap:6px}
  .convo-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:78%;padding:9px 13px;border-radius:12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;animation:fade .25s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;background:var(--coral);color:var(--ink);border-bottom-right-radius:4px;font-weight:500}
  .msg.bot{align-self:flex-start;background:rgba(245,239,230,.06);color:var(--cream);border-bottom-left-radius:4px;border:1px solid var(--line)}
  .msg.bot .meta{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--coral);margin-bottom:4px;letter-spacing:.1em;text-transform:uppercase}
  .typing{display:inline-flex;gap:3px;padding:9px 13px;background:rgba(245,239,230,.06);border:1px solid var(--line);border-radius:12px;align-self:flex-start;width:fit-content}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--cream-2);opacity:.5;animation:bounce 1.2s ease infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.3}40%{transform:translateY(-5px);opacity:1}}
  .convo-input{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:var(--bg-4)}
  .convo-input input{flex:1;padding:9px 14px;background:rgba(245,239,230,.05);border:1px solid var(--line-2);border-radius:99px;color:var(--cream);font-family:inherit;font-size:13.5px;outline:0}
  .convo-input input:focus{border-color:var(--coral)}
  .convo-input button{padding:9px 18px;background:var(--coral);color:var(--ink);border:0;border-radius:99px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer}
  .convo-input button:disabled{opacity:.5;cursor:not-allowed}

  /* fleet grid */
  .fleet-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(220px,1fr));gap:12px}
  .fleet-card{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .2s,transform .2s}
  .fleet-card:hover{border-color:var(--line-3);transform:translateY(-2px)}
  .fleet-card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
  .fleet-card .model{font-family:'Manrope',sans-serif;font-weight:600;font-size:16px;color:var(--cream);letter-spacing:-.01em;line-height:1.15}
  .fleet-card .plate{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cream-3);letter-spacing:.06em;margin-top:2px}
  .fleet-card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .fleet-card .meta .km{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cream-3);letter-spacing:.04em}
  .fleet-card .meta .km b{color:var(--cream);font-weight:600}

  /* settings */
  .integration{display:grid;grid-template-columns:32px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);transition:background .2s}
  .integration:last-child{border-bottom:none}
  .integration:hover{background:rgba(245,239,230,.02)}
  .integration .ico{width:32px;height:32px;border-radius:7px;background:var(--bg-3);display:flex;align-items:center;justify-content:center;color:var(--coral);font-weight:700;font-size:14px;border:1px solid var(--line-2)}
  .integration .info .name{font-size:13.5px;color:var(--cream);font-weight:600}
  .integration .info .desc{font-size:11.5px;color:var(--cream-3);margin-top:2px;line-height:1.4}
  .integration .right{display:flex;gap:8px;align-items:center}
  .field{margin-bottom:14px}
  .field label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--cream-3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
  .field input{width:100%;padding:9px 14px;background:rgba(245,239,230,.04);border:1px solid var(--line-2);border-radius:7px;color:var(--cream);font-family:'JetBrains Mono',monospace;font-size:12.5px;outline:0;letter-spacing:.02em}
  .field input:focus{border-color:var(--coral)}
  .field input::placeholder{color:var(--cream-4);font-style:italic}
  .field .help{font-size:11.5px;color:var(--cream-3);margin-top:6px;line-height:1.4}
  .field .help a{color:var(--coral);text-decoration:none}

  /* sync row */
  .sync-row{display:grid;grid-template-columns:32px 1fr auto auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
  .sync-row:last-child{border-bottom:none}
  .sync-row .ico{width:32px;height:32px;border-radius:7px;background:var(--bg-3);display:flex;align-items:center;justify-content:center;color:var(--coral);font-weight:700;font-size:13px;border:1px solid var(--line-2)}
  .sync-row .name{font-size:13.5px;color:var(--cream);font-weight:600}
  .sync-row .desc{font-size:11.5px;color:var(--cream-3);margin-top:2px}
  .sync-row .when{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cream-3);letter-spacing:.04em;text-align:right;line-height:1.4}
  .sync-row .when b{color:var(--cream);font-weight:500;display:block}

  /* customer table specifics */
  .lang-flag{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 7px;background:var(--bg-3);color:var(--cream-2);border-radius:4px;letter-spacing:.06em;font-weight:600}
  .cashback{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--coral);font-weight:600;letter-spacing:.04em}

  /* empty state for chat */
  .convo-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--cream-4);font-size:13px;text-align:center;padding:40px}
  .convo-empty b{font-family:'Manrope',sans-serif;font-size:18px;color:var(--cream-2);font-weight:600;letter-spacing:-.01em}

  /* AI assistant (internal) */
  .asst-host{display:grid;grid-template-columns:1fr 280px;gap:14px;height:calc(100vh - 160px)}
  .asst-main{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
  .asst-side{display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0;padding-right:6px}
  .asst-side .card .b{padding:14px 16px}
  .asst-body{flex:1;overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column;gap:12px}
  .asst-msg{max-width:88%;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;animation:fade .25s ease both}
  .asst-msg.user{align-self:flex-end;background:var(--coral);color:var(--ink);padding:10px 14px;border-radius:14px;border-bottom-right-radius:4px;font-weight:500;max-width:80%}
  .asst-msg.bot{align-self:flex-start;color:var(--cream);max-width:96%}
  .asst-msg.bot .meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--coral);margin-bottom:6px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .asst-msg.bot .body{background:rgba(245,239,230,.04);border:1px solid var(--line);padding:11px 14px;border-radius:12px;border-bottom-left-radius:4px}
  /* tool call card */
  .tool-call{align-self:flex-start;max-width:96%;background:rgba(74,143,168,.07);border:1px solid rgba(74,143,168,.25);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:11.5px;animation:fade .25s ease both;overflow:hidden}
  .tool-call .head{padding:9px 13px;background:rgba(74,143,168,.13);border-bottom:1px solid rgba(74,143,168,.2);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .tool-call .head .nm{color:var(--sea);font-weight:600;letter-spacing:.05em;display:flex;align-items:center;gap:7px}
  .tool-call .head .nm::before{content:"►";font-size:10px}
  .tool-call .head .status{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
  .tool-call .head .status.running{color:var(--warn)}
  .tool-call .head .status.done{color:var(--green)}
  .tool-call .head .status .pulse{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:5px;animation:pulse 1s ease-in-out infinite}
  .tool-call .input{padding:9px 13px;color:var(--cream-3);border-bottom:1px dashed var(--line-2);background:rgba(0,0,0,.12)}
  .tool-call .input b{color:var(--sea);font-weight:500}
  .tool-call .output{padding:10px 13px;color:var(--cream-2);max-height:200px;overflow-y:auto}
  .tool-call .output pre{font-family:inherit;white-space:pre-wrap;word-break:break-word;color:var(--cream-2);line-height:1.55}
  .tool-call .output b{color:var(--green);font-weight:500}
  .tool-call .output .row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dotted rgba(245,239,230,.06)}
  .tool-call .output .row:last-child{border-bottom:none}
  .asst-input{padding:14px 16px;border-top:1px solid var(--line);display:flex;gap:10px;background:var(--bg-4)}
  .asst-input textarea{flex:1;padding:10px 14px;background:rgba(245,239,230,.05);border:1px solid var(--line-2);border-radius:10px;color:var(--cream);font-family:inherit;font-size:14px;outline:0;resize:none;min-height:42px;max-height:160px;line-height:1.5}
  .asst-input textarea:focus{border-color:var(--coral)}
  .asst-input button{padding:10px 18px;background:var(--coral);color:var(--ink);border:0;border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer;align-self:flex-end}
  .asst-input button:disabled{opacity:.5;cursor:not-allowed}
  .asst-suggest{display:flex;flex-direction:column;gap:6px}
  .asst-suggest .sg{text-align:left;padding:10px 13px;background:rgba(245,239,230,.03);border:1px solid var(--line-2);border-radius:8px;color:var(--cream);font-family:inherit;font-size:12.5px;cursor:pointer;transition:all .2s;line-height:1.4}
  .asst-suggest .sg:hover{background:rgba(255,107,71,.08);border-color:var(--coral)}
  .tool-list{display:flex;flex-direction:column;gap:1px;background:var(--line)}
  .tool-list .t{background:var(--bg-2);padding:9px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cream-2);letter-spacing:.04em;display:flex;align-items:center;gap:8px}
  .tool-list .t::before{content:"►";color:var(--sea);font-size:10px}
  .asst-greeting{align-self:flex-start;max-width:96%;padding:18px 22px;background:linear-gradient(135deg,rgba(255,107,71,.07),rgba(74,143,168,.06));border:1px solid var(--line);border-radius:14px;border-bottom-left-radius:4px}
  .asst-greeting h4{font-family:'Manrope',sans-serif;font-size:17px;font-weight:600;color:var(--cream);letter-spacing:-.01em;margin-bottom:8px}
  .asst-greeting p{font-size:13.5px;color:var(--cream-2);line-height:1.55}
  .asst-greeting p code{font-family:'JetBrains Mono',monospace;background:rgba(255,107,71,.15);color:var(--coral);padding:1px 5px;border-radius:3px;font-size:11.5px}

  /* ===== tool labels / list ===== */
  .tool-call .head .nm{flex-wrap:wrap;align-items:center;line-height:1.2}
  .tool-call .head .nm .en{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:9.5px;opacity:.5;letter-spacing:.04em;text-transform:none;margin-left:8px;font-weight:400;display:inline-block}
  .tool-list .t{font-family:'Manrope',sans-serif;font-weight:500;text-transform:none;letter-spacing:.005em;font-size:12.5px;cursor:help}
  .tool-list .t::before{margin-right:0}
  .tool-list details.t-detail{display:block;background:var(--bg-2);border-bottom:1px solid var(--line,rgba(128,128,128,.12))}
  .tool-list details.t-detail:last-child{border-bottom:none}
  .tool-list summary.t{cursor:pointer;list-style:none;transition:background .15s;padding-right:14px;user-select:none}
  .tool-list summary.t::-webkit-details-marker{display:none}
  .tool-list summary.t::marker{display:none}
  .tool-list summary.t::after{content:"+";margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;opacity:.4;line-height:1;transition:transform .2s}
  .tool-list details.t-detail[open] summary.t::after{content:"−";opacity:.85}
  .tool-list details.t-detail[open] summary.t{font-weight:600}
  .tool-list details.t-detail summary.t:hover{filter:brightness(1.06)}
  .tool-list .t-desc{padding:2px 16px 14px 32px;font-family:'Manrope',sans-serif;font-size:11.5px;line-height:1.6;opacity:.78;font-weight:400;letter-spacing:0;text-transform:none;animation:fadeDesc .25s ease}
  @keyframes fadeDesc{from{opacity:0;transform:translateY(-3px)}to{opacity:.78;transform:none}}

  /* гамбургер (по умолчанию скрыт, виден на мобиле) */
  .hamb{display:none;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg-4);color:var(--cream);cursor:pointer;flex-shrink:0;font-size:18px;line-height:1}
  .nav-overlay{display:none}

  /* ===== ДЕСКТОП (≥961px): полноэкранный layout, скролл внутри карточек ===== */
  @media (min-width:961px){
    html,body,#root{height:100%;overflow:hidden;min-height:0}
    .app{height:100vh;max-height:100vh;overflow:hidden}
    .main{height:100vh;overflow:hidden;display:flex;flex-direction:column;min-height:0}
    .content{flex:1 1 0;min-height:0;overflow-y:auto;height:auto}
    .asst-host{height:calc(100vh - 170px);min-height:0}
    .asst-main{min-height:0;max-height:100%;height:100%;overflow:hidden;display:flex;flex-direction:column}
    .asst-side{min-height:0;max-height:100%;height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-right:4px}
    .asst-body{flex:1 1 0;min-height:0;overflow-y:auto;max-height:none}
    .tool-list{max-height:55vh;overflow-y:auto}
    .asst-suggest{max-height:35vh;overflow-y:auto}
  }

  /* ===== МОБИЛЬНЫЙ (≤960px): один блок, ничего не скачет ===== */
  @media (max-width:960px){
    html,body,#root{height:auto;min-height:100vh;overflow-x:hidden;overflow-y:auto}
    .app{grid-template-columns:1fr;height:auto;min-height:100vh;overflow:visible}
    .main,.content{height:auto;overflow:visible;min-height:0}
    .content{padding:14px}
    .topbar{padding:0 12px;gap:10px}
    .search{display:none}
    .hamb{display:inline-flex}
    /* сайдбар → выезжающая панель */
    .side{position:fixed;top:0;left:0;bottom:0;width:80%;max-width:300px;z-index:60;transform:translateX(-100%);transition:transform .25s ease;display:flex;overflow-y:auto}
    .side.open{transform:translateX(0);box-shadow:0 0 60px rgba(0,0,0,.6)}
    .nav-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
    .nav-overlay.open{opacity:1;pointer-events:auto}
    /* сетки в одну колонку */
    .stats{grid-template-columns:1fr 1fr;gap:10px}
    .grid-2,.grid-3{grid-template-columns:1fr}
    .page-head{align-items:flex-start}
    .page-head h1{font-size:20px}
    .card .h{flex-wrap:wrap;gap:8px}
    .card .h .actions{flex-wrap:wrap}
    /* таблицы — горизонтальный скролл внутри карточки */
    .b.flush{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tbl{min-width:620px}
    /* ассистент */
    .asst-host{grid-template-columns:1fr;height:auto}
    .asst-side{height:auto;max-height:none;overflow:visible;padding-right:0}
    .asst-main{min-height:70vh}
    .asst-body{max-height:60vh;overflow-y:auto}
    .tool-list,.asst-suggest{max-height:none;overflow:visible}
  }
  @media (max-width:480px){
    .stats{grid-template-columns:1fr}
    .page-head .actions{width:100%}
  }

  /* скрыть скроллбары, оставив скролл */
  .tool-list,.asst-suggest{scrollbar-width:none;-ms-overflow-style:none}
  .tool-list::-webkit-scrollbar,.asst-suggest::-webkit-scrollbar{display:none;width:0;height:0}

</style>
</head>
<body>
<div id="root"></div>

<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/app.js"></script>

</body>
</html>
